<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Abstract colorful host-city tournament background">
  <defs>
    <pattern id="paperGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#071421" stroke-opacity=".026" stroke-width="1"/>
    </pattern>
    <pattern id="dotsNavy" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#071421"/>
    </pattern>
    <pattern id="dotsPaper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.15" fill="#F7F3EA"/>
    </pattern>
    <clipPath id="topRight"><rect x="1240" y="0" width="360" height="350"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="#F7F3EA"/>
  <rect width="1600" height="1000" fill="url(#paperGrid)"/>

  <!-- fixed six-color tournament rail -->
  <path fill="#59F0D0" d="M0 0h320v7H0z"/>
  <path fill="#3452F4" d="M320 0h330v7H320z"/>
  <path fill="#6F35D9" d="M650 0h235v7H650z"/>
  <path fill="#F04454" d="M885 0h220v7H885z"/>
  <path fill="#FF7A2D" d="M1105 0h255v7h-255z"/>
  <path fill="#AFF000" d="M1360 0h240v7h-240z"/>

  <!-- mint host mark behind the primary heading -->
  <circle cx="0" cy="172" r="154" fill="#59F0D0"/>
  <path d="M0 332 122 210 0 238Z" fill="#F7F3EA"/>
  <path d="M0 350 96 254 0 275Z" fill="#59F0D0"/>

  <!-- left wayfinding stripes and blue paper wedge -->
  <g stroke="#59F0D0" stroke-width="10">
    <path d="m0 354 94-94"/><path d="m22 365 94-94"/><path d="m48 368 88-88"/>
  </g>
  <path d="M0 410 270 690 188 1000H0Z" fill="#3452F4"/>
  <path d="M0 435 158 593 0 545Z" fill="#F7F3EA"/>
  <path d="m34 366 98 0-49 49Z" fill="#3452F4"/>
  <rect x="0" y="568" width="134" height="154" fill="url(#dotsPaper)" opacity=".95"/>
  <text x="-42" y="850" fill="#F7F3EA" font-family="Arial Narrow, sans-serif" font-size="200" font-weight="900" letter-spacing="-18" transform="rotate(-11 -42 850)">26</text>

  <!-- red cropped stadium rings -->
  <g clip-path="url(#topRight)" fill="none" stroke="#F04454">
    <circle cx="1585" cy="110" r="94" stroke-width="46"/>
    <circle cx="1585" cy="110" r="178" stroke-width="46"/>
    <circle cx="1585" cy="110" r="262" stroke-width="46"/>
  </g>
  <rect x="1195" y="78" width="190" height="130" fill="url(#dotsNavy)" opacity=".08"/>

  <!-- right-side orange host fragment -->
  <path d="M1600 520 1335 790 1600 1000Z" fill="#FF7A2D"/>
  <path d="m1600 590-162 164 162-56Z" fill="#F7F3EA"/>
  <path d="m1600 706-122 124 122-42Z" fill="#071421" opacity=".12"/>
  <rect x="1458" y="785" width="142" height="215" fill="url(#dotsPaper)" opacity=".88"/>
  <text x="1460" y="1020" fill="#F7F3EA" font-family="Arial Narrow, sans-serif" font-size="190" font-weight="900" letter-spacing="-16" transform="rotate(-14 1460 1020)">26</text>

  <!-- small registration details -->
  <g fill="#071421" opacity=".28">
    <circle cx="1395" cy="905" r="5"/><circle cx="1414" cy="905" r="5"/><circle cx="1433" cy="905" r="5"/>
  </g>
  <g stroke="#071421" stroke-width="2" opacity=".32">
    <path d="M116 914h74M153 877v74"/>
    <path d="M1310 700h70M1345 665v70"/>
  </g>
</svg>
